[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-agent-core"
version = "0.1.0"
description = "Shared LangGraph agent kernel: decision graph, tool ports, Agent Skill host, shell and storage policy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "robot-agent-runtime>=0.1.0",
    "langgraph>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
