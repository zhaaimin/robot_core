[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-agent-mcp"
version = "0.1.0"
description = "MCP bridge (stdio or streamable HTTP) to an existing robot-agent-runtime server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["robot-agent-runtime>=0.1.0", "robot-agent-capabilities>=0.1.0", "mcp>=1.30,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
robot-runtime-mcp = "robot_runtime_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_runtime_mcp = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
