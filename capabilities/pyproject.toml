[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-agent-capabilities"
version = "0.1.0"
description = "Agent-independent robot tool catalog and task execution client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["robot-agent-runtime>=0.1.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_agent_capabilities = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
